name: Hotfix client appointment ownership

on:
  push:
    paths:
      - '.github/workflows/hotfix-client-appointment-ownership.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch ambiguous client relation
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/services/cliente-app/appointments.ts')
          text = path.read_text(encoding='utf-8')
          old = 'id, id_salao, cliente_id, profissional_id, servico_id, id_comanda, status, data, hora_inicio, hora_fim, clientes(nome), profissionais(nome, nome_exibicao), servicos(nome)'
          new = 'id, id_salao, cliente_id, profissional_id, servico_id, id_comanda, status, data, hora_inicio, hora_fim, clientes!agendamentos_cliente_id_fkey(nome), profissionais(nome, nome_exibicao), servicos(nome)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 ownership select to patch, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit hotfix
        run: |
          if git diff --quiet -- app/services/cliente-app/appointments.ts; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/cliente-app/appointments.ts
          git commit -m 'fix: disambiguate client relation in appointment actions'
          git push origin HEAD:main
