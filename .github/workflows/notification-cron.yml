name: Notification Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Call notification cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: https://app.salaopremiun.com.br/api/cron/notificacoes
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not configured; skipping."
            exit 0
          fi

          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$CRON_URL"
