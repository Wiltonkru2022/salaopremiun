name: UI Autofix Once

on:
  push:
    branches:
      - agent/auditoria-ptbr-painel-real
    paths-ignore:
      - '.github/workflows/ui-autofix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/auditoria-ptbr-painel-real
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply structural UI fixes
        run: node scripts/audit/ui-structural-corrector.mjs

      - name: Apply PT-BR fixes
        run: node scripts/audit/ui-quality-audit.mjs --fix

      - name: Validate corrected UI
        run: node scripts/audit/ui-quality-audit.mjs

      - name: Commit corrected sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção pendente."
            exit 0
          fi

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "persiste correcoes automaticas de UI e PT-BR"
          git push origin HEAD:agent/auditoria-ptbr-painel-real
