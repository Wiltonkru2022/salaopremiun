name: Agenda Panel Hardening Autofix

on:
  push:
    branches:
      - agent/painel-hardening-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/painel-hardening-final
          fetch-depth: 0

      - name: Aplicar hardening das ações da agenda
        run: node scripts/audit/patch-agenda-panel-actions.mjs

      - name: Commitar correções
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/agenda/useAgendaMutations.ts
          git commit -m "roteia ações rápidas da agenda pela API"
          git push origin HEAD:agent/painel-hardening-final
