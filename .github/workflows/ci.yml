name: CI

on:
  push:
    branches: [main, principal]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Estas credenciais sao publicas por definicao do Supabase e podem ser
    # usadas no bundle web/PWA e no GitHub Actions. Credenciais administrativas
    # continuam exclusivas do ambiente seguro da Vercel.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://rcyoqfmduockncbztmen.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T_BPx7iurGWoYHJgbWEYNw_s_6VqoIf
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_T_BPx7iurGWoYHJgbWEYNw_s_6VqoIf

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload main source snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: salaopremiun-main-${{ github.sha }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck Next
        run: npm run typecheck

      - name: Typecheck App Profissional Vite
        run: npm run typecheck:professional

      - name: Test App Cliente identity
        run: npx vitest run lib/client-app/identity.test.ts

      - name: Test App Cliente visual notices
        run: npx vitest run lib/client-app/visual-notifications.test.ts

      - name: Test safe internal redirects
        run: npx vitest run lib/security/safe-next-path.test.ts

      - name: Test Web Push delivery policies
        run: npx vitest run lib/push-delivery-utils.test.ts

      - name: Audit painel PT-BR
        run: node scripts/audit/painel-ui-text-audit.mjs --check

      - name: Audit
        continue-on-error: true
        run: npm run audit

      - name: Build
        run: npm run build
