name: Painel PT-BR Autofix

on:
  push:
    branches:
      - agent/painel-hardening-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/painel-hardening-final
          fetch-depth: 0

      - name: Normalizar textos do painel
        run: node scripts/audit/painel-ui-text-audit.mjs --fix

      - name: Commitar correções se necessário
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma correção pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'(painel)' components core/i18n/pt-BR.ts
          git commit -m "normaliza textos PT-BR do painel"
          git push origin HEAD:agent/painel-hardening-final
